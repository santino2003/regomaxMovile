<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Regomax</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 700px;
        }

        #reader {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .resultado {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background: #d1e7dd;
            border: 2px solid #198754;
        }

        .resultado.show {
            display: block;
        }

        .codigo {
            font-size: 22px;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">

    <h2 class="mb-3">
        Scanner Regomax
    </h2>

    <button
        id="btnIniciar"
        class="btn btn-primary w-100 mb-3">
        Iniciar Scanner
    </button>

    <div id="reader"></div>

    <div id="resultado" class="resultado">
        <h4>✅ Código Detectado</h4>

        <div>
            Tipo:
            <strong id="tipo"></strong>
        </div>

        <div class="codigo mt-2" id="codigo"></div>

        <button
            class="btn btn-success mt-3"
            onclick="reiniciarScanner()">
            Escanear otro
        </button>
    </div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

let scanner = null;

function beep() {
    try {
        const ctx = new(window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.frequency.value = 1000;

        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.01,
            ctx.currentTime + 0.15
        );

        osc.start();
        osc.stop(ctx.currentTime + 0.15);

    } catch(e) {
        console.error(e);
    }
}

function mostrarResultado(texto, tipoCodigo) {

    beep();

    document.getElementById('tipo').innerText = tipoCodigo;
    document.getElementById('codigo').innerText = texto;

    document
        .getElementById('resultado')
        .classList.add('show');
}

async function iniciarScanner() {

    document
        .getElementById('resultado')
        .classList.remove('show');

    scanner = new Html5Qrcode("reader");

    try {

        await scanner.start(
            {
                facingMode: "environment"
            },
            {
                fps: 10,

                qrbox: {
                    width: 300,
                    height: 200
                },

                formatsToSupport: [

                    Html5QrcodeSupportedFormats.QR_CODE,

                    Html5QrcodeSupportedFormats.CODE_128,

                    Html5QrcodeSupportedFormats.CODE_39,

                    Html5QrcodeSupportedFormats.EAN_13,

                    Html5QrcodeSupportedFormats.EAN_8,

                    Html5QrcodeSupportedFormats.UPC_A,

                    Html5QrcodeSupportedFormats.UPC_E

                ]
            },

            async (decodedText, decodedResult) => {

                let tipo = "Desconocido";

                try {
                    tipo =
                        decodedResult.result.format.formatName;
                } catch {}

                await scanner.stop();

                mostrarResultado(
                    decodedText,
                    tipo
                );
            },

            () => {
                // ignorar errores mientras busca
            }
        );

    } catch (err) {

        alert(
            "Error iniciando cámara: " +
            err.message
        );
    }
}

async function reiniciarScanner() {

    document
        .getElementById('resultado')
        .classList.remove('show');

    await iniciarScanner();
}

document
    .getElementById('btnIniciar')
    .addEventListener(
        'click',
        iniciarScanner
    );

</script>

</body>
</html>
